# This file: checkmake.ini

# Help targets (e.g. py-help in mk/20-python.mk) print a screenful of text, one
# echo per line, so allow a longer body than checkmake's default.
[maxbodylength]
maxBodyLength = 20

# Disabled because of a false positive: checkmake does not see the recipe of a
# target whose body is inside an ifeq/else block, so it wrongly reports the
# sv2v netlist target in mk/40-synth.mk as "should be declared PHONY". That
# target is a real file, so declaring it PHONY would be wrong. There is no way
# to waive a single target, so the rule is off for the whole project.
[phonydeclared]
disabled = true

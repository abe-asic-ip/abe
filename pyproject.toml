# This file: pyproject.toml

[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "abe"
dynamic = ["version"]
description = "ABE: A Better Environment for Open-Source ASIC IP Development"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Hugh Walsh" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]

# Version policy: each range starts at the version verified with ABE's tests and
# stops before the next major release (before the next minor for 0.x packages),
# so an unverified major release is never picked up by accident. The exact
# verified versions of every package, including indirect ones, are pinned in
# constraints.txt; see docs/python_dev.md.

# Runtime deps
dependencies = ["PyYAML>=6.0.3,<7"]

[project.urls]
Homepage = "https://github.com/abe-asic-ip/abe"

[project.optional-dependencies]
dev = [
    "black>=26.5,<27",
    "isort>=9.0,<10",
    "pylint>=4.0.8,<5",
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "pytest-xdist>=3.8,<4",
    "types-setuptools>=84.0.0.20260812",
    "types-PyYAML>=6.0.12.20260906",
    "matplotlib>=3.11,<4",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7,<10",
    "pymdown-extensions>=12.0,<13",
]
rad = ["pyuvm>=5.0,<6", "cocotb>=2.1,<3", "cocotb-coverage>=2.0,<3"]
uarch = [
    "tabulate>=0.10,<0.11",
    "types-tabulate>=0.10.0.20260508",
    "pydantic>=2.13,<3",
    "ortools>=9.15,<10",
    "Pint>=0.26,<0.27",
]

[project.scripts]
dv = "abe.rad.tools.dv:main"
dv-make-bench = "abe.rad.tools.dv_make_bench:main"
dv-regress = "abe.rad.tools.dv_regress:main"
dv-regress-all = "abe.rad.tools.dv_regress_all:main"
dv-report = "abe.rad.tools.dv_report:main"
pkt-quantize = "abe.uarch.pkt_quantize:main"
fifo-depth = "abe.uarch.fifo_depth:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["abe*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
abe = ["py.typed"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
fallback_version = "0.0.0"

[tool.isort]
profile = "black"
line_length = 88

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.pylint.BASIC]
typevar-rgx = "^[A-Z][A-Z0-9_]*$"

[tool.pyright]
stubPath = "typings"
